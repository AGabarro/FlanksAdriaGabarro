services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flanks
      POSTGRES_PASSWORD: flanks
      POSTGRES_DB: flanks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flanks -d flanks"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  ingest:
    build: .
    command: python -m app.ingest
    environment:
      DATABASE_URL: postgresql+psycopg://flanks:flanks@db:5432/flanks
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://flanks:flanks@db:5432/flanks
    depends_on:
      ingest:
        condition: service_completed_successfully

volumes:
  pgdata:
